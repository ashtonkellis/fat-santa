<!doctype html>
<!--
  Flip-book viewer — companion page to index.html.
  Displays the flip-chart tracker art (flip-chart-art/*.png): three resource
  tracks (Present, Reindeer, Sled), each with a 6-step quality ladder and
  5 count pages. Static, dependency-free.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fat-santa Flip Book</title>
<style>
  :root {
    --bg: #14171c; --panel: #1e232b; --panel2: #262c36; --line: #333b47;
    --text: #e8ebf0; --muted: #99a3b2; --accent: #f4b942; --accent2: #5aa9e6;
    --c-reindeer: #d9edcf; --c-sled: #d4e2f2; --c-present: #e6dbf4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent2); }

  header {
    padding: 22px 24px 16px; background: linear-gradient(180deg, #1b2029, #14171c);
    border-bottom: 1px solid var(--line);
  }
  header .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header .ver { font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; }
  header .links { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  header .links a {
    text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font-weight: 600; font-size: 13px;
  }
  header p.desc { color: var(--muted); margin: 8px 0 0; max-width: 820px; font-size: 13px; }

  .banner { text-align: center; padding: 20px 24px 4px; }
  .banner img { max-width: 640px; width: 100%; height: auto; border-radius: 10px; }

  main { padding: 14px 24px 70px; max-width: 1200px; margin: 0 auto; }

  .track { margin: 30px 0 10px; }
  .track > h2 {
    margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 10px;
  }
  .track .em { font-size: 26px; line-height: 1; }
  .track .rule { height: 3px; border-radius: 3px; margin: 6px 0 16px; }
  .track.present .rule { background: var(--c-present); }
  .track.reindeer .rule { background: var(--c-reindeer); }
  .track.sled .rule { background: var(--c-sled); }

  .subhead { color: var(--muted); font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 10px; }

  .strip {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  figure.page { margin: 0; }
  figure.page a { display: block; }
  figure.page img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); box-shadow: 0 3px 9px rgba(0,0,0,.30);
  }
  .track.present figure.page img { border-color: var(--c-present); }
  .track.reindeer figure.page img { border-color: var(--c-reindeer); }
  .track.sled figure.page img { border-color: var(--c-sled); }
  figure.page figcaption { margin-top: 7px; text-align: center; }
  figure.page .lvl { font-weight: 700; font-size: 14px; }
  figure.page .sub { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📖 fat-santa Flip Book</h1>
    <span class="ver" id="ver" title="Deployed version"></span>
    <div class="links">
      <a href="index.html">← Cards</a>
    </div>
  </div>
  <p class="desc">The flip-chart tracker pages (Cities &amp; Knights style). Each of the
  three resource tracks has a <strong>quality ladder</strong> — level 1 (junk) up to
  level 6 (the dream) — and <strong>count pages</strong> showing 1–5 of the resource.
  Click any page to open the full image.</p>
</header>

<div class="banner"><img src="board-art/fat-santa-title.png" alt="Fat Santa title banner" /></div>

<main id="tracks"></main>

<script>
  // Show the deployed version (from the repo-root VERSION file) at the top.
  fetch("VERSION", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) { t = (t || "").trim(); if (t) document.getElementById("ver").textContent = "v" + t; })
    .catch(function () {});

  // Flip-book data. Filenames follow flip-chart-art/<key>-quality-<1..6>.png
  // and flip-chart-art/<key>-count-<1..5>.png (see docs/flip-chart-image-prompts.md).
  var DIR = "flip-chart-art/";
  var TRACKS = [
    { key: "present", emoji: "🎁", name: "Present",
      quality: ["a lump of coal", "a cheap trinket", "a decent gift",
                "a really good gift", "a spectacular gift", "a Nintendo 64"] },
    { key: "reindeer", emoji: "🦌", name: "Reindeer",
      quality: ["scrawny & sickly", "ordinary", "healthy",
                "strong", "majestic", "Rudolph"] },
    { key: "sled", emoji: "🛷", name: "Sled",
      quality: ["broken cardboard", "basic wooden sled", "freshly painted",
                "racing sled", "classic sleigh", "rocket sleigh"] },
  ];

  function page(src, lvl, sub) {
    var fig = document.createElement("figure");
    fig.className = "page";
    var a = document.createElement("a");
    a.href = src; a.target = "_blank"; a.rel = "noopener";
    var img = document.createElement("img");
    img.src = src; img.loading = "lazy"; img.alt = lvl + (sub ? " — " + sub : "");
    a.appendChild(img);
    var cap = document.createElement("figcaption");
    cap.innerHTML = '<div class="lvl">' + lvl + "</div>" +
                    (sub ? '<div class="sub">' + sub + "</div>" : "");
    fig.appendChild(a); fig.appendChild(cap);
    return fig;
  }

  var root = document.getElementById("tracks");
  TRACKS.forEach(function (t) {
    var sec = document.createElement("section");
    sec.className = "track " + t.key;
    sec.innerHTML = '<h2><span class="em">' + t.emoji + "</span>" + t.name + " track</h2>" +
                    '<div class="rule"></div>';

    var qh = document.createElement("div"); qh.className = "subhead";
    qh.textContent = "Quality ladder"; sec.appendChild(qh);
    var qs = document.createElement("div"); qs.className = "strip";
    for (var i = 1; i <= 6; i++) {
      qs.appendChild(page(DIR + t.key + "-quality-" + i + ".png",
                          "Level " + i, t.quality[i - 1]));
    }
    sec.appendChild(qs);

    var ch = document.createElement("div"); ch.className = "subhead";
    ch.textContent = "Count pages"; sec.appendChild(ch);
    var cs = document.createElement("div"); cs.className = "strip";
    for (var j = 1; j <= 5; j++) {
      cs.appendChild(page(DIR + t.key + "-count-" + j + ".png",
                          "×" + j, j === 1 ? t.name : t.name + "s"));
    }
    sec.appendChild(cs);

    root.appendChild(sec);
  });
</script>
</body>
</html>
