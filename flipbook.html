<!doctype html>
<!--
  Flip-book viewer — companion page to index.html.
  Models the physical flip book as a sequence of leaves, each with a FRONT
  and a BACK. A "levels" side shows the three resource tracks (Present, Sled,
  Reindeer) at a given quality level; the cover side shows the title banner.
  Art lives in flip-chart-art/*.png and board-art/*.png. Static, no deps.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fat-santa Flip Book</title>
<style>
  :root {
    --bg: #14171c; --panel: #1e232b; --panel2: #262c36; --line: #333b47;
    --text: #e8ebf0; --muted: #99a3b2; --accent: #f4b942; --accent2: #5aa9e6;
    --c-reindeer: #d9edcf; --c-sled: #d4e2f2; --c-present: #e6dbf4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent2); }

  header {
    padding: 22px 24px 16px; background: linear-gradient(180deg, #1b2029, #14171c);
    border-bottom: 1px solid var(--line);
  }
  header .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header .ver { font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; }
  header .links { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  header .links a {
    text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font-weight: 600; font-size: 13px;
  }
  header p.desc { color: var(--muted); margin: 8px 0 0; max-width: 860px; font-size: 13px; }

  main { padding: 18px 24px 70px; max-width: 1080px; margin: 0 auto; }

  .leaf { margin: 26px 0; }
  .leaf > .leaf-title { font-size: 17px; font-weight: 700; margin: 0 0 10px;
    display: flex; align-items: center; gap: 10px; }
  .leaf > .leaf-title .pill { font-size: 11px; font-weight: 700; color: var(--bg);
    background: var(--accent); border-radius: 20px; padding: 2px 9px; text-transform: uppercase; letter-spacing: .03em; }

  .sides { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .sides { grid-template-columns: 1fr; } }

  .side {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; display: flex; flex-direction: column;
  }
  .side > .side-tag { font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; margin: 0 0 10px; }

  /* cover side (logo banner) */
  .cover { flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--panel2); border-radius: 10px; padding: 16px; min-height: 180px; }
  .cover img { max-width: 100%; height: auto; border-radius: 8px; }

  /* blank side */
  .blank { flex: 1; min-height: 180px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; background: var(--panel2); border-radius: 10px;
    border: 1px dashed var(--line); }

  /* levels side: three resource columns */
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  figure.cell { margin: 0; }
  figure.cell a { display: block; }
  figure.cell img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
    border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); }
  figure.cell.present img { border-color: var(--c-present); }
  figure.cell.sled img { border-color: var(--c-sled); }
  figure.cell.reindeer img { border-color: var(--c-reindeer); }
  figure.cell figcaption { margin-top: 6px; text-align: center; }
  figure.cell .rn { font-weight: 700; font-size: 13px; }
  figure.cell .rs { color: var(--muted); font-size: 11px; }
  .lvl-tag { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }

  .note { margin: 30px 0 0; padding: 12px 14px; border-left: 3px solid var(--accent);
    background: var(--panel); border-radius: 0 8px 8px 0; color: var(--muted); font-size: 13px; }
  .note strong { color: var(--text); }

  section.counts { margin-top: 40px; padding-top: 8px; border-top: 1px solid var(--line); }
  section.counts h2 { font-size: 18px; margin: 18px 0 4px; }
  .count-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📖 fat-santa Flip Book</h1>
    <span class="ver" id="ver" title="Deployed version"></span>
    <div class="links">
      <a href="index.html">← Cards</a>
    </div>
  </div>
  <p class="desc">The flip book laid out leaf by leaf — each leaf has a
  <strong>front</strong> and a <strong>back</strong>. The level sides show the three
  resource tracks together (<strong>Present · Sled · Reindeer</strong>), worst at the
  top of the book, best at the bottom. Click any page to open the full image.</p>
</header>

<main id="book"></main>

<script>
  // Deployed version badge.
  fetch("VERSION", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) { t = (t || "").trim(); if (t) document.getElementById("ver").textContent = "v" + t; })
    .catch(function () {});

  var ART = "flip-chart-art/";
  var BANNER = "board-art/fat-santa-title.png";

  // Short descriptor per resource + quality level (1..6).
  var WORDS = {
    present:  ["a lump of coal", "a cheap trinket", "a decent gift", "a really good gift", "a spectacular gift", "a Nintendo 64"],
    sled:     ["broken cardboard", "basic wooden sled", "freshly painted", "racing sled", "classic sleigh", "rocket sleigh"],
    reindeer: ["scrawny & sickly", "ordinary", "healthy", "strong", "majestic", "Rudolph"]
  };
  var RES_NAME = { present: "Present", sled: "Sled", reindeer: "Reindeer" };
  // Column order on every level side (as specified): Present, then Sled, then Reindeer.
  var COL_ORDER = ["present", "sled", "reindeer"];

  // A "side" of a leaf is one of:
  //   { cover: true }            -> the title banner
  //   { level: N }               -> the three tracks at quality rank N
  //   { blank: true }            -> intentionally blank (back cover)
  // PAGES lists leaves top -> bottom. Leaf 1 front is the cover.
  // Per spec: leaf 1 front = logo, leaf 1 back = rank 1 (worst); then one rank
  // per side, each rank once (rank 2, 3, 4, 5, 6), best at the bottom.
  var PAGES = [
    { front: { cover: true }, back: { level: 1 } },
    { front: { level: 2 },    back: { level: 3 } },
    { front: { level: 4 },    back: { level: 5 } },
    { front: { level: 6 },    back: { blank: true } }
  ];

  function cell(res, lvl) {
    var src = ART + res + "-quality-" + lvl + ".png";
    var fig = document.createElement("figure");
    fig.className = "cell " + res;
    fig.innerHTML =
      '<a href="' + src + '" target="_blank" rel="noopener">' +
        '<img src="' + src + '" loading="lazy" alt="' + RES_NAME[res] + ' level ' + lvl + '">' +
      '</a>' +
      '<figcaption><div class="rn">' + RES_NAME[res] + '</div>' +
      '<div class="rs">' + WORDS[res][lvl - 1] + '</div></figcaption>';
    return fig;
  }

  function sideEl(side, tag) {
    var el = document.createElement("div");
    el.className = "side";
    var t = document.createElement("div"); t.className = "side-tag"; t.textContent = tag;
    el.appendChild(t);
    if (side.cover) {
      var c = document.createElement("div"); c.className = "cover";
      c.innerHTML = '<img src="' + BANNER + '" alt="Fat Santa title banner">';
      el.appendChild(c);
    } else if (side.blank) {
      var b = document.createElement("div"); b.className = "blank";
      b.textContent = "(blank — back cover)";
      el.appendChild(b);
    } else if (side.level) {
      var lt = document.createElement("div"); lt.className = "lvl-tag";
      lt.textContent = "Level " + side.level + (side.level === 1 ? " — the worst" : side.level === 6 ? " — the best" : "");
      el.appendChild(lt);
      var cols = document.createElement("div"); cols.className = "cols";
      COL_ORDER.forEach(function (res) { cols.appendChild(cell(res, side.level)); });
      el.appendChild(cols);
    }
    return el;
  }

  var book = document.getElementById("book");
  PAGES.forEach(function (pg, i) {
    var leaf = document.createElement("section");
    leaf.className = "leaf";
    var title = document.createElement("div"); title.className = "leaf-title";
    title.innerHTML = '<span class="pill">Leaf ' + (i + 1) + '</span>';
    leaf.appendChild(title);
    var sides = document.createElement("div"); sides.className = "sides";
    sides.appendChild(sideEl(pg.front, "Front"));
    sides.appendChild(sideEl(pg.back, "Back"));
    leaf.appendChild(sides);
    book.appendChild(leaf);
  });

  // Count pages (x1..x5 per resource) — not yet placed in the book above.
  var counts = document.createElement("section");
  counts.className = "counts";
  counts.innerHTML = '<div class="note"><strong>Count pages</strong> (×1–×5 of each resource) ' +
    'are shown below for reference — tell me where they belong in the flip book and I\'ll place them.</div>';
  COL_ORDER.forEach(function (res) {
    var h = document.createElement("h2"); h.textContent = RES_NAME[res] + " — count pages"; counts.appendChild(h);
    var g = document.createElement("div"); g.className = "count-grid";
    for (var n = 1; n <= 5; n++) {
      var src = ART + res + "-count-" + n + ".png";
      var fig = document.createElement("figure"); fig.className = "cell " + res; fig.style.margin = "0";
      fig.innerHTML = '<a href="' + src + '" target="_blank" rel="noopener">' +
        '<img src="' + src + '" loading="lazy" alt="' + RES_NAME[res] + ' x' + n + '"></a>' +
        '<figcaption><div class="rn">×' + n + '</div></figcaption>';
      g.appendChild(fig);
    }
    counts.appendChild(g);
  });
  book.appendChild(counts);
</script>
</body>
</html>
