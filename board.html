<!doctype html>
<!--
  Game-board viewer / print UI — companion to index.html and flipbook.html.
  Shows the illustrated fat-santa world-map board (board-art/world-map.webp) and
  prints it at a chosen size: one A4 landscape sheet, or a tiled poster (2x2 /
  3x3) split across sheets you tape together. Static, no deps.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fat-santa Game Board</title>
<style>
  :root {
    --bg: #14171c; --panel: #1e232b; --panel2: #262c36; --line: #333b47;
    --text: #e8ebf0; --muted: #99a3b2; --accent: #f4b942; --accent2: #5aa9e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent2); }

  header { padding: 22px 24px 16px; background: linear-gradient(180deg, #1b2029, #14171c);
    border-bottom: 1px solid var(--line); }
  header .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header .ver { font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; }
  header .links { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  header .links a, header .links button.linkbtn {
    text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
  header .links button.linkbtn:hover { border-color: var(--accent); }
  header .links label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header .links select { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; }
  header p.desc { color: var(--muted); margin: 8px 0 0; max-width: 820px; font-size: 13px; }

  main { padding: 20px 24px 70px; }
  .stage { max-width: 1100px; margin: 0 auto; }
  .board-preview { width: 100%; border-radius: 10px; display: block;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); background: var(--panel2); }
  .missing { padding: 40px; text-align: center; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 10px; }

  /* ---- print: single sheet or tiled poster ---- */
  .print-root { display: none; }
  @media print {
    body > header, body > main { display: none !important; }
    .print-root { display: block !important; }
    @page { size: A4 landscape; margin: 6mm; }
    .sheet { width: 285mm; height: 198mm; overflow: hidden; position: relative;
      page-break-after: always; }
    .sheet:last-child { page-break-after: auto; }
    .sheet img.poster { position: absolute; top: 0; left: 0; display: block;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🗺️ fat-santa Game Board</h1>
    <span class="ver" id="ver" title="Deployed version"></span>
    <div class="links">
      <label>Size
        <select id="sizeSel">
          <option value="1">1 page (A4)</option>
          <option value="2">Poster 2×2</option>
          <option value="3">Poster 3×3</option>
        </select>
      </label>
      <button id="printBtn" class="linkbtn">🖨 Print board</button>
      <a href="flipbook.html">📖 Flip book</a>
      <a href="index.html">← Cards</a>
    </div>
  </div>
  <p class="desc">The illustrated fat-santa world-map board. Pick a size and print —
  <strong>1 page</strong> fits an A4 landscape sheet; the <strong>poster</strong> sizes
  tile the board across that many sheets to tape together.</p>
</header>

<main><div class="stage" id="stage"></div></main>

<div class="print-root" id="printRoot"></div>

<script>
  fetch("VERSION", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) { t = (t || "").trim(); if (t) document.getElementById("ver").textContent = "v" + t; })
    .catch(function () {});

  var BOARD = "board-art/world-map.webp";

  // Screen preview (falls back to a message if the image is missing).
  var stage = document.getElementById("stage");
  var img = new Image();
  img.className = "board-preview";
  img.alt = "fat-santa world-map board";
  img.onerror = function () {
    stage.innerHTML = '<div class="missing">Board image not found at <code>' + BOARD + '</code>.</div>';
  };
  img.src = BOARD;
  stage.appendChild(img);

  // Build print sheets for an N x N tiling, slicing the board across page-sized
  // clip windows. The board fills the whole poster (stretched to the page grid).
  var PAGE_W = 285, PAGE_H = 198; // mm, matches @page A4 landscape minus margins
  function buildPrint(n) {
    var root = document.getElementById("printRoot");
    root.innerHTML = "";
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var sheet = document.createElement("div"); sheet.className = "sheet";
        var poster = document.createElement("img"); poster.className = "poster"; poster.src = BOARD;
        poster.style.width = (PAGE_W * n) + "mm";
        poster.style.height = (PAGE_H * n) + "mm";
        poster.style.left = "-" + (PAGE_W * c) + "mm";
        poster.style.top = "-" + (PAGE_H * r) + "mm";
        sheet.appendChild(poster);
        root.appendChild(sheet);
      }
    }
  }

  document.getElementById("printBtn").addEventListener("click", function () {
    buildPrint(parseInt(document.getElementById("sizeSel").value, 10) || 1);
    // give the sheet images a tick to be laid out before printing
    setTimeout(function () { window.print(); }, 60);
  });
</script>
</body>
</html>
