<!doctype html>
<!--
  Card list browser — the GitHub Pages landing page for this repo.
  Loads data/fat_santa_cards.csv (the fat-santa deckbuilder card set) and lets
  you search / filter / sort it. Links to the card generator.
  Static, dependency-free.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fat-santa Cards</title>
<style>
  :root {
    --bg: #14171c; --panel: #1e232b; --panel2: #262c36; --line: #333b47;
    --text: #e8ebf0; --muted: #99a3b2; --accent: #f4b942; --accent2: #5aa9e6;
    /* fat-santa resource color scheme (see docs/color-scheme.md) */
    --c-default:  #f3f6ef;            /* Action / all other cards — subtle Christmas off-white */
    --c-money:    #f7ecc6;            /* Money — light yellow */
    --c-reindeer: #d9edcf;            /* Reindeer — light Christmas green */
    --c-sled:     #d4e2f2;            /* Sled — light blue */
    --c-present:  #e6dbf4;            /* Presents — light purple */
    --c-rest:     #c3c7cd;            /* cards with the Rest keyword (terminal / "stop") — coal grey */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent2); }
  header {
    padding: 22px 24px 16px; background: linear-gradient(180deg, #1b2029, #14171c);
    border-bottom: 1px solid var(--line);
  }
  header .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header .count { color: var(--muted); font-size: 14px; }
  header .ver { font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; }
  header .links { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  header .links a {
    text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font-weight: 600; font-size: 13px;
  }
  header .links a.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  header p.desc { color: var(--muted); margin: 8px 0 0; max-width: 780px; font-size: 13px; }

  .controls {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .controls input[type=search], .controls select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 11px; font: inherit;
  }
  .controls input[type=search] { flex: 1; min-width: 200px; }
  .controls .muted { color: var(--muted); font-size: 13px; margin-left: auto; }
  .chip { font-size: 12px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }

  main { padding: 20px 24px 60px; }
  .grid { display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

  /* ---- full-art card face: the art fills the whole card; cost, name and
     effects sit on translucent overlays (Terraforming Mars: Ares style) ---- */
  .card {
    position: relative; aspect-ratio: 5 / 7; border-radius: 12px; overflow: hidden;
    color: #241d13; box-shadow: 0 4px 12px rgba(0,0,0,.30);
    border: 3px solid var(--accent, #b5892f);
    background-color: var(--pale, var(--c-default));   /* fallback if art is missing */
    background-size: cover; background-position: center; background-repeat: no-repeat;
  }
  /* top overlay: cost coin + name on a dark scrim so they read over any art */
  .card .fa-top { position: absolute; left: 0; right: 0; top: 0; display: flex;
    align-items: flex-start; gap: 8px; padding: 9px 11px 24px;
    background: linear-gradient(to bottom, rgba(0,0,0,.80), rgba(0,0,0,.36) 55%, transparent); }
  .card .fa-cost { flex: 0 0 auto; font-size: 25px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .card .fa-cost.empty { display: none; }
  .card .fa-name { font-weight: 800; font-size: 15px; line-height: 1.13; color: #fff;
    padding-top: 1px; text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.85); }

  /* A coin: the number sits centered on top of a larger coin image.
     Size scales with the parent font-size (so it grows in the cost badge
     and stays inline-sized within card text). */
  .coin { position: relative; display: inline-flex; align-items: center;
    justify-content: center; vertical-align: middle; line-height: 1; }
  .coin .coin-i { font-size: 1.5em; line-height: 1; display: block; }
  /* Center the number on the coin's geometric center, independent of the
     emoji glyph's own line-box metrics. */
  .coin .coin-n { position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); line-height: 1;
    font-weight: 800; font-size: 0.78em; color: #4a3b10;
    letter-spacing: -0.02em; text-shadow: 0 1px 1px rgba(255,255,255,.65); }
  /* bottom overlay: an effects panel (warm parchment) over the lower art */
  .card .fa-bottom { position: absolute; left: 0; right: 0; bottom: 0; }
  .card .fa-panel { padding: 6px 10px 8px; border-top: 2px solid var(--accent, #b5892f);
    background: linear-gradient(to top, rgba(250,246,236,.98), rgba(250,246,236,.9)); }
  .card .fa-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .card .fa-type { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    color: #fff; background: var(--accent, #b5892f); padding: 1px 8px; border-radius: 999px; }
  .card .fa-vp { margin-left: auto; font-weight: 800; font-size: 12px; color: #2f5324;
    background: #dcecd2; border: 1px solid #9ec090; border-radius: 6px; padding: 0 6px; }
  .card .fa-effect { font-size: 12px; line-height: 1.28; white-space: pre-wrap; color: #241d13; }

  /* per-type accent (border + ribbon) and pale fallback background */
  .t-Money    { --accent: #c9962a; --pale: var(--c-money); }
  .t-Reindeer { --accent: #3f8f43; --pale: var(--c-reindeer); }
  .t-Sled     { --accent: #2f6fb0; --pale: var(--c-sled); }
  .t-Present  { --accent: #7a4fb0; --pale: var(--c-present); }
  .t-Action   { --accent: #b5892f; --pale: var(--c-default); }
  .t-Rest     { --accent: #6b7078; --pale: var(--c-rest); }

  .empty-msg { color: var(--muted); padding: 40px; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 24px; border-top: 1px solid var(--line); }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .linkbtn { text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font: inherit; font-weight: 600;
    font-size: 13px; cursor: pointer; }
  .linkbtn:hover { border-color: var(--accent); }

  /* ---- print: lay out the currently-shown cards at real poker size ---- */
  .print-area { display: none; }
  @media print {
    body { background: #fff; }
    body > header, body > .controls, body > main, body > footer { display: none !important; }
    .print-area { display: flex !important; flex-wrap: wrap; gap: 0; }
    /* full-art card face at real poker size */
    .print-area .pcard {
      position: relative; width: 63mm; height: 88mm; box-sizing: border-box; overflow: hidden;
      border: 0.6mm solid var(--accent, #b5892f); border-radius: 3mm; page-break-inside: avoid;
      color: #241d13; background-color: var(--pale, var(--c-default));
      background-size: cover; background-position: center; background-repeat: no-repeat;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .print-area .pcard .fa-top { position: absolute; left: 0; right: 0; top: 0; display: flex;
      align-items: flex-start; gap: 2mm; padding: 2.5mm 3mm 7mm;
      background: linear-gradient(to bottom, rgba(0,0,0,.80), rgba(0,0,0,.36) 55%, transparent); }
    .print-area .pcard .fa-cost { flex: 0 0 auto; font-size: 6mm; filter: drop-shadow(0 0.2mm 0.4mm rgba(0,0,0,.7)); }
    .print-area .pcard .fa-cost.empty { display: none; }
    .print-area .pcard .fa-name { font-weight: 800; font-size: 3.7mm; line-height: 1.1; color: #fff;
      text-shadow: 0 0.3mm 0.6mm rgba(0,0,0,.95); }
    .print-area .pcard .fa-bottom { position: absolute; left: 0; right: 0; bottom: 0; }
    .print-area .pcard .fa-panel { padding: 1.5mm 3mm 2mm; border-top: 0.5mm solid var(--accent, #b5892f);
      background: linear-gradient(to top, rgba(250,246,236,.98), rgba(250,246,236,.9)); }
    .print-area .pcard .fa-meta { display: flex; align-items: center; gap: 1.5mm; margin-bottom: 0.8mm; }
    .print-area .pcard .fa-type { font-size: 2.4mm; font-weight: 800; text-transform: uppercase; letter-spacing: .3px;
      color: #fff; background: var(--accent, #b5892f); padding: 0.2mm 1.8mm; border-radius: 999px; }
    .print-area .pcard .fa-vp { margin-left: auto; font-weight: 800; font-size: 2.9mm; color: #2f5324;
      background: #dcecd2; border: 0.3mm solid #9ec090; border-radius: 1.5mm; padding: 0 1.5mm; }
    .print-area .pcard .fa-effect { font-size: 3mm; line-height: 1.25; white-space: pre-wrap; color: #241d13; }
    @page { size: A4; margin: 8mm; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🎅 fat-santa Cards</h1>
    <span class="ver" id="ver" title="Deployed version"></span>
    <span class="count" id="count">loading…</span>
    <div class="links">
      <button id="printBtn" class="linkbtn">🖨 Print cards</button>
      <a class="primary" href="card-generator.html">Open card generator →</a>
      <a href="data/fat_santa_cards.csv">Raw CSV</a>
    </div>
  </div>
  <p class="desc" id="desc"></p>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Search name or card text…" autocomplete="off" />
  <select id="typeSel"><option value="">All types</option></select>
  <select id="sortSel">
    <option value="type">Sort: by type / color</option>
    <option value="cost">Sort: cost ↑</option>
    <option value="costDesc">Sort: cost ↓</option>
    <option value="name">Sort: name A–Z</option>
  </select>
  <span class="muted" id="shown"></span>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-msg" id="empty" style="display:none">No cards match your filters.</div>
</main>

<footer id="footer"></footer>
<div class="print-area" id="printArea"></div>

<script>
"use strict";
const state = { cards: [], meta: {}, filtered: [] };

function costNum(c) {
  const m = String(c || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : -1;
}
function typesStr(c) { return (c.types || []).join(" · "); }
function primaryType(c) { return (c.types && c.types[0]) || ""; }

// Every card has exactly one of the six types; sorting by type == sorting by color.
function colorKey(c) {
  const order = { Money: 0, Reindeer: 1, Sled: 2, Present: 3, Action: 4, Rest: 5 };
  return order[primaryType(c)] ?? 4;
}
function presentBadge(v) {
  if (v == null || v === "") return "";
  if (v === "*" || v === "?") return "★🎁";      // variable-value Present card
  return v + "🎁";
}

/* minimal RFC-4180-ish CSV parser (handles quotes, commas, embedded newlines) */
function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch === "\r") { /* skip */ }
      else cur += ch;
    }
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const header = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(c => c !== "")).map(r => {
    const o = {}; header.forEach((h, i) => o[h] = (r[i] ?? "").trim()); return o;
  });
}

function load() {
  fetch("data/fat_santa_cards.csv")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(text => {
      const raw = parseCSV(text);
      state.cards = raw.map(r => ({
        name: r.name,
        cost: r.cost,
        types: (r.types || "").split("/").map(s => s.trim()).filter(Boolean),
        presents: r.presents || "",
        text: r.text || "",
      }));
      initControls();
      render();
      document.getElementById("count").textContent = state.cards.length + " cards";
      document.getElementById("desc").textContent =
        "An original Christmas deckbuilder with Dominion-style rules and four resources — " +
        "🪙 Money (buy currency), 🦌 Reindeer, 🛷 Sled, and 🎁 Presents (victory points). " +
        "Delivery cards convert reindeer + sled into presents; most presents wins.";
      document.getElementById("footer").innerHTML =
        "Card data: <code>data/fat_santa_cards.csv</code> · original game content (not affiliated with Dominion).";
    })
    .catch(err => {
      document.getElementById("count").textContent = "";
      document.getElementById("grid").innerHTML =
        '<div class="empty-msg">Could not load <code>data/fat_santa_cards.csv</code> (' + err.message +
        ').<br>This page must be served over HTTP (e.g. GitHub Pages or <code>python3 -m http.server</code>), not opened from disk.</div>';
    });
}

function initControls() {
  const types = new Set();
  state.cards.forEach(c => (c.types || []).forEach(t => types.add(t)));
  const typeSel = document.getElementById("typeSel");
  [...types].sort().forEach(t => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t; typeSel.appendChild(o);
  });
  ["q", "typeSel", "sortSel"].forEach(id =>
    document.getElementById(id).addEventListener("input", render));
  document.getElementById("printBtn").addEventListener("click", printCards);
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const type = document.getElementById("typeSel").value;
  const sort = document.getElementById("sortSel").value;

  let rows = state.cards.filter(c => {
    if (type && !(c.types || []).includes(type)) return false;
    if (q) {
      const hay = (c.name + " " + (c.text || "") + " " + typesStr(c)).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    if (sort === "name") return a.name.localeCompare(b.name);
    if (sort === "costDesc") return costNum(b.cost) - costNum(a.cost) || a.name.localeCompare(b.name);
    if (sort === "type")
      return colorKey(a) - colorKey(b) || costNum(a.cost) - costNum(b.cost) || a.name.localeCompare(b.name);
    // default: cost ascending, then name
    return costNum(a.cost) - costNum(b.cost) || a.name.localeCompare(b.name);
  });

  state.filtered = rows;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  rows.forEach(c => frag.appendChild(cardEl(c)));
  grid.appendChild(frag);

  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  document.getElementById("shown").textContent =
    "showing " + rows.length + " of " + state.cards.length;
}

function printCards() {
  const rows = state.filtered;
  if (!rows.length) { alert("No cards to print — adjust your filters."); return; }
  if (rows.length > 100 &&
      !confirm("You're about to print " + rows.length + " cards (" +
               Math.ceil(rows.length / 9) + "+ pages). Continue?")) return;
  const area = document.getElementById("printArea");
  area.innerHTML = "";
  rows.forEach(c => area.appendChild(buildFace(c, "pcard")));
  window.print();
}

// Resource icons: replace the resource words with icons for display only
// (the underlying CSV keeps the words).
const RES_ICON = { Money: "🪙", Reindeer: "🦌", Sled: "🛷", Present: "🎁" };
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// A coin renders as the number centered on top of a larger coin image.
function coinHtml(n) {
  return '<span class="coin"><span class="coin-i">🪙</span><span class="coin-n">' + n + '</span></span>';
}
// Returns HTML (set via innerHTML): resource words -> icons, and every "$N"
// -> a coin with N overlaid on it.
function iconify(s) {
  return escHtml(s)
    .replace(/reindeer/gi, "🦌")
    .replace(/sled/gi, "🛷")
    .replace(/presents?/gi, "🎁")
    .replace(/\$(\d+)/g, (_, n) => coinHtml(n));
}
function typeLabel(c) {
  const pt = primaryType(c);
  return RES_ICON[pt] || pt;   // resource types -> icon; Action / Rest -> word
}

// Card name -> web-optimized art path (matches scripts/optimize_card_art.py slugs).
function slugName(name) {
  return String(name).toLowerCase().replace(/&/g, "and").replace(/[’'`]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function artUrl(c) { return "card-art/web/" + slugName(c.name) + ".webp"; }

// Build a full-art card face: the illustration fills the card, with the cost
// coin + name on a dark top scrim and the effect text on a parchment panel at
// the bottom. `cls` is "card" (browser grid) or "pcard" (print sheet); the two
// share this markup and differ only in CSS sizing.
function buildFace(c, cls) {
  const el = document.createElement(cls === "pcard" ? "div" : "article");
  el.className = cls + " t-" + primaryType(c);
  el.style.backgroundImage = "url('" + artUrl(c) + "')";

  const top = document.createElement("div"); top.className = "fa-top";
  const cost = document.createElement("div");
  cost.className = "fa-cost" + (c.cost ? "" : " empty");
  cost.innerHTML = iconify(c.cost || "");
  const name = document.createElement("div");
  name.className = "fa-name"; name.textContent = c.name;
  top.appendChild(cost); top.appendChild(name);
  el.appendChild(top);

  const bottom = document.createElement("div"); bottom.className = "fa-bottom";
  const panel = document.createElement("div"); panel.className = "fa-panel";
  const meta = document.createElement("div"); meta.className = "fa-meta";
  const type = document.createElement("div");
  type.className = "fa-type"; type.textContent = primaryType(c);
  meta.appendChild(type);
  if (c.presents) {
    const vp = document.createElement("div");
    vp.className = "fa-vp"; vp.textContent = presentBadge(c.presents);
    meta.appendChild(vp);
  }
  panel.appendChild(meta);
  if (c.text) {
    const eff = document.createElement("div");
    eff.className = "fa-effect"; eff.innerHTML = iconify(c.text);
    panel.appendChild(eff);
  }
  bottom.appendChild(panel);
  el.appendChild(bottom);
  return el;
}
function cardEl(c) { return buildFace(c, "card"); }

// Show the deployed version (from the repo-root VERSION file) at the top.
function loadVersion() {
  fetch("VERSION", { cache: "no-store" })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(v => { v = v.trim(); if (v) document.getElementById("ver").textContent = "v" + v; })
    .catch(() => {});
}

loadVersion();
load();
</script>
</body>
</html>
