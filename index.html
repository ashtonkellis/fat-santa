<!doctype html>
<!--
  Card list browser — the GitHub Pages landing page for this repo.
  Loads data/fat_santa_cards.csv (the fat-santa deckbuilder card set) and lets
  you search / filter / sort it. Links to the card generator.
  Static, dependency-free.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fat-santa Cards</title>
<style>
  :root {
    --bg: #14171c; --panel: #1e232b; --panel2: #262c36; --line: #333b47;
    --text: #e8ebf0; --muted: #99a3b2; --accent: #f4b942; --accent2: #5aa9e6;
    --action: #f6efe0; --victory: #d7ead0; --treasure: #f7ecc6; --attack: #eed7d3;
    --reaction: #d4e2f2; --duration: #ffe6c2; --night: #d7d3e6; --curse: #e0d0e2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  a { color: var(--accent2); }
  header {
    padding: 22px 24px 16px; background: linear-gradient(180deg, #1b2029, #14171c);
    border-bottom: 1px solid var(--line);
  }
  header .top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  header .count { color: var(--muted); font-size: 14px; }
  header .links { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  header .links a {
    text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font-weight: 600; font-size: 13px;
  }
  header .links a.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  header p.desc { color: var(--muted); margin: 8px 0 0; max-width: 780px; font-size: 13px; }

  .controls {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .controls input[type=search], .controls select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 11px; font: inherit;
  }
  .controls input[type=search] { flex: 1; min-width: 200px; }
  .controls .muted { color: var(--muted); font-size: 13px; margin-left: auto; }
  .chip { font-size: 12px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }

  main { padding: 20px 24px 60px; }
  .grid { display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

  .card {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--action); color: #241d13; display: flex; flex-direction: column;
    min-height: 150px; box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }
  .card .chead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .card .cost {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
    background: #f4d03f; border: 2px solid #8a6d1a; color: #4a3b10;
    font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .card .cost.empty { visibility: hidden; }
  .card .name { font-weight: 700; font-size: 16px; line-height: 1.15; }
  .card .vp { margin-left: auto; flex: 0 0 auto; font-weight: 800; font-size: 12px;
    background: #cfe3c6; border: 1px solid #9ec090; border-radius: 6px; padding: 1px 6px; color: #2f5324; }
  .card .types { padding: 0 12px 6px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .4px; color: #6a5c3c; }
  .card .text { padding: 6px 12px 10px; font-size: 12.5px; white-space: pre-wrap;
    line-height: 1.3; border-top: 1px solid rgba(0,0,0,.08); margin-top: auto; }
  .card .setline { padding: 6px 12px 10px; font-size: 11px; font-style: italic; color: #7a6f5a;
    display: flex; justify-content: space-between; }

  /* tint by primary type (fat-santa resource types) */
  .card.t-Money { background: var(--treasure); }
  .card.t-Present { background: var(--victory); }
  .card.t-Reindeer { background: #ecdfc8; }
  .card.t-Sled { background: var(--reaction); }
  .card.t-Attack { background: var(--attack); }
  .card.t-Reaction { background: var(--reaction); }
  .card.t-Duration { background: var(--duration); }
  .card.t-Coal { background: #35353f; color: #e8e6f2; }
  .card.t-Coal .types, .card.t-Coal .setline { color: #c9c6d4; }
  .card.t-Coal .text { border-top-color: rgba(255,255,255,.14); }

  .empty-msg { color: var(--muted); padding: 40px; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 24px; border-top: 1px solid var(--line); }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .linkbtn { text-decoration: none; background: var(--panel2); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 8px; color: var(--text); font: inherit; font-weight: 600;
    font-size: 13px; cursor: pointer; }
  .linkbtn:hover { border-color: var(--accent); }

  /* ---- print: lay out the currently-shown cards at real poker size ---- */
  .print-area { display: none; }
  @media print {
    body { background: #fff; }
    body > header, body > .controls, body > main, body > footer { display: none !important; }
    .print-area { display: flex !important; flex-wrap: wrap; gap: 0; }
    .print-area .pcard {
      width: 63mm; height: 88mm; box-sizing: border-box; overflow: hidden;
      border: 0.3mm solid #333; border-radius: 3mm; page-break-inside: avoid;
      display: flex; flex-direction: column; background: #fbf7ec; color: #241d13;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .print-area .pchead { display: flex; align-items: center; gap: 2mm; padding: 2.5mm 3mm 1mm; }
    .print-area .pcost { flex: 0 0 auto; width: 7mm; height: 7mm; border-radius: 50%;
      background: #f4d03f; border: 0.5mm solid #8a6d1a; color: #4a3b10; font-weight: 800;
      font-size: 3mm; display: flex; align-items: center; justify-content: center; }
    .print-area .pcost.empty { visibility: hidden; }
    .print-area .pname { font-weight: 700; font-size: 4mm; line-height: 1.1; }
    .print-area .pvp { margin-left: auto; font-weight: 800; font-size: 3mm;
      background: #cfe3c6; border: 0.3mm solid #9ec090; border-radius: 1.5mm; padding: 0.3mm 1.5mm; color: #2f5324; }
    .print-area .ptypes { padding: 0 3mm 1mm; font-size: 2.6mm; font-weight: 700;
      text-transform: uppercase; letter-spacing: .3px; color: #6a5c3c; }
    .print-area .ptext { padding: 1.5mm 3mm; font-size: 3mm; white-space: pre-wrap;
      line-height: 1.25; border-top: 0.2mm solid rgba(0,0,0,.12); margin-top: auto; }
    .print-area .pset { padding: 1.5mm 3mm 2mm; font-size: 2.4mm; font-style: italic; color: #7a6f5a; }
    @page { size: A4; margin: 8mm; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🎅 fat-santa Cards</h1>
    <span class="count" id="count">loading…</span>
    <div class="links">
      <button id="printBtn" class="linkbtn">🖨 Print cards</button>
      <a class="primary" href="card-generator.html">Open card generator →</a>
      <a href="data/fat_santa_cards.csv">Raw CSV</a>
    </div>
  </div>
  <p class="desc" id="desc"></p>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Search name or card text…" autocomplete="off" />
  <select id="setSel"><option value="">All sets</option></select>
  <select id="typeSel"><option value="">All types</option></select>
  <select id="sortSel">
    <option value="set">Sort: by set</option>
    <option value="name">Sort: name A–Z</option>
    <option value="cost">Sort: cost ↑</option>
    <option value="costDesc">Sort: cost ↓</option>
  </select>
  <span class="muted" id="shown"></span>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-msg" id="empty" style="display:none">No cards match your filters.</div>
</main>

<footer id="footer"></footer>
<div class="print-area" id="printArea"></div>

<script>
"use strict";
const state = { cards: [], meta: {}, setOrder: {}, filtered: [] };

function costNum(c) {
  const m = String(c || "").match(/\d+/);
  return m ? parseInt(m[0], 10) : -1;
}
function typesStr(c) { return (c.types || []).join(" · "); }
function primaryType(c) { return (c.types && c.types[0]) || ""; }
function presentBadge(v) {
  if (v == null || v === "") return "";
  if (v === "*" || v === "?") return "★🎁";      // variable-value Present card
  return v + "🎁";
}

/* minimal RFC-4180-ish CSV parser (handles quotes, commas, embedded newlines) */
function parseCSV(text) {
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch === "\r") { /* skip */ }
      else cur += ch;
    }
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  if (!rows.length) return [];
  const header = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(c => c !== "")).map(r => {
    const o = {}; header.forEach((h, i) => o[h] = (r[i] ?? "").trim()); return o;
  });
}

function load() {
  fetch("data/fat_santa_cards.csv")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(text => {
      const raw = parseCSV(text);
      state.cards = raw.map(r => ({
        name: r.name,
        cost: r.cost,
        set: r.set,
        types: (r.types || "").split("/").map(s => s.trim()).filter(Boolean),
        presents: r.presents || "",
        text: r.text || "",
      }));
      // derive set order + counts by first appearance
      const counts = {}, order = [];
      state.cards.forEach(c => {
        if (!(c.set in counts)) { counts[c.set] = 0; order.push(c.set); }
        counts[c.set]++;
      });
      order.forEach((s, i) => state.setOrder[s] = i);
      const setsList = order.map(s => ({ name: s, count: counts[s] }));
      initControls({ sets: setsList });
      render();
      document.getElementById("count").textContent = state.cards.length + " cards";
      document.getElementById("desc").textContent =
        "An original Christmas deckbuilder with Dominion-style rules and four resources — " +
        "🪙 Money (buy currency), 🦌 Reindeer, 🛷 Sled, and 🎁 Presents (victory points). " +
        "Delivery cards convert reindeer + sled into presents; most presents wins.";
      document.getElementById("footer").innerHTML =
        "Card data: <code>data/fat_santa_cards.csv</code> · original game content (not affiliated with Dominion).";
    })
    .catch(err => {
      document.getElementById("count").textContent = "";
      document.getElementById("grid").innerHTML =
        '<div class="empty-msg">Could not load <code>data/fat_santa_cards.csv</code> (' + err.message +
        ').<br>This page must be served over HTTP (e.g. GitHub Pages or <code>python3 -m http.server</code>), not opened from disk.</div>';
    });
}

function initControls(d) {
  const setSel = document.getElementById("setSel");
  (d.sets || []).forEach(s => {
    const o = document.createElement("option");
    o.value = s.name; o.textContent = s.name + " (" + s.count + ")";
    setSel.appendChild(o);
  });
  const types = new Set();
  state.cards.forEach(c => (c.types || []).forEach(t => types.add(t)));
  const typeSel = document.getElementById("typeSel");
  [...types].sort().forEach(t => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t; typeSel.appendChild(o);
  });
  ["q", "setSel", "typeSel", "sortSel"].forEach(id =>
    document.getElementById(id).addEventListener("input", render));
  document.getElementById("printBtn").addEventListener("click", printCards);
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const set = document.getElementById("setSel").value;
  const type = document.getElementById("typeSel").value;
  const sort = document.getElementById("sortSel").value;

  let rows = state.cards.filter(c => {
    if (set && c.set !== set) return false;
    if (type && !(c.types || []).includes(type)) return false;
    if (q) {
      const hay = (c.name + " " + (c.text || "") + " " + typesStr(c)).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  rows.sort((a, b) => {
    if (sort === "name") return a.name.localeCompare(b.name);
    if (sort === "cost") return costNum(a.cost) - costNum(b.cost) || a.name.localeCompare(b.name);
    if (sort === "costDesc") return costNum(b.cost) - costNum(a.cost) || a.name.localeCompare(b.name);
    // by set (release order), then cost, then name
    return (state.setOrder[a.set] - state.setOrder[b.set]) ||
           (costNum(a.cost) - costNum(b.cost)) || a.name.localeCompare(b.name);
  });

  state.filtered = rows;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  rows.forEach(c => frag.appendChild(cardEl(c)));
  grid.appendChild(frag);

  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  document.getElementById("shown").textContent =
    "showing " + rows.length + " of " + state.cards.length;
}

function printCards() {
  const rows = state.filtered;
  if (!rows.length) { alert("No cards to print — adjust your filters."); return; }
  if (rows.length > 100 &&
      !confirm("You're about to print " + rows.length + " cards (" +
               Math.ceil(rows.length / 9) + "+ pages). Continue?")) return;
  const area = document.getElementById("printArea");
  area.innerHTML = "";
  rows.forEach(c => {
    const card = document.createElement("div");
    card.className = "pcard";
    const head = document.createElement("div"); head.className = "pchead";
    const cost = document.createElement("div");
    cost.className = "pcost" + (c.cost ? "" : " empty"); cost.textContent = c.cost || "";
    const name = document.createElement("div"); name.className = "pname"; name.textContent = c.name;
    head.appendChild(cost); head.appendChild(name);
    if (c.presents) {
      const vp = document.createElement("div"); vp.className = "pvp";
      vp.textContent = presentBadge(c.presents);
      head.appendChild(vp);
    }
    card.appendChild(head);
    const types = document.createElement("div"); types.className = "ptypes";
    types.textContent = typesStr(c); card.appendChild(types);
    if (c.text) {
      const text = document.createElement("div"); text.className = "ptext";
      text.textContent = c.text; card.appendChild(text);
    }
    const setline = document.createElement("div"); setline.className = "pset";
    setline.textContent = c.set; card.appendChild(setline);
    area.appendChild(card);
  });
  window.print();
}

function cardEl(c) {
  const el = document.createElement("article");
  const pt = primaryType(c);
  el.className = "card t-" + pt;

  const head = document.createElement("div");
  head.className = "chead";
  const cost = document.createElement("div");
  cost.className = "cost" + (c.cost ? "" : " empty");
  cost.textContent = c.cost || "";
  const name = document.createElement("div");
  name.className = "name"; name.textContent = c.name;
  head.appendChild(cost); head.appendChild(name);
  if (c.presents) {
    const vp = document.createElement("div");
    vp.className = "vp";
    vp.textContent = presentBadge(c.presents);
    head.appendChild(vp);
  }
  el.appendChild(head);

  const types = document.createElement("div");
  types.className = "types"; types.textContent = typesStr(c);
  el.appendChild(types);

  if (c.text) {
    const text = document.createElement("div");
    text.className = "text"; text.textContent = c.text;
    el.appendChild(text);
  }
  const setline = document.createElement("div");
  setline.className = "setline";
  setline.innerHTML = "<span>" + escapeHtml(c.set) + "</span>";
  el.appendChild(setline);
  return el;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

load();
</script>
</body>
</html>
